<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Matemáticas: Detecta el Error</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Renderizado LaTeX MathJax -->
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            startup: {
                pageReady: function () {
                    MathJax.startup.defaultPageReady();
                    if (typeof initializeGame === 'function') {
                        initializeGame(); 
                    }
                }
            }
        };
    </script>

    <!-- Carga de los 3 Bancos de Preguntas Independientes -->
    <script src="nivel_bajo.js"></script>
    <script src="nivel_intermedio.js"></script>
    <script src="nivel_alto.js"></script>

    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior-y: contain; /* Evita recargas fortuitas en Android al deslizar hacia abajo */
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            padding: 12px; 
            margin: 0;
        }

        .container { 
            background-color: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); 
            max-width: 800px; 
            width: 100%; 
            margin-top: 10px; 
        }

        .main-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 1.25rem;
            text-align: center;
            line-height: 1.3;
        }

        .player-area {
            margin-bottom: 1.25rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-label {
            display: block;
            color: #374151;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        input[type="text"], select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #d1d5db; 
            border-radius: 10px; 
            background-color: #fff; 
            font-size: 1rem; 
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
        }

        input[type="text"]:focus, select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .question-card { 
            background-color: #ffffff; 
            padding: 16px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 1rem;
        }

        .option-label { 
            display: flex;
            align-items: center;
            padding: 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.15s ease-in-out; 
            background-color: #f8fafc; 
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.4;
            min-height: 52px; /* Tamaño optimizado para pulsación táctil en Android */
            touch-action: manipulation;
        }

        .option-label:active { 
            background-color: #eff6ff; 
            border-color: #93c5fd; 
            transform: scale(0.99);
        }

        input[type="radio"]:checked + .option-label { 
            background-color: #e0e7ff; 
            border-color: #4f46e5; 
            color: #312e81; 
            font-weight: 600; 
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.15);
        }

        input[type="radio"] { 
            display: none; 
        }

        .submit-button { 
            background-color: #4f46e5; 
            color: white; 
            padding: 16px 20px; 
            border-radius: 12px; 
            font-weight: 700; 
            transition: background-color 0.2s; 
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25); 
            border: none; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1.05rem;
            touch-action: manipulation;
            min-height: 52px;
        }

        .submit-button:active { 
            background-color: #4338ca; 
            transform: scale(0.98);
        }

        .submit-button:disabled { 
            background-color: #a5b4fc; 
            cursor: not-allowed; 
            transform: none;
        }

        .btn-diploma {
            background-color: #0d9488;
            color: white;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1rem;
            width: 100%;
            touch-action: manipulation;
        }

        .btn-diploma:active {
            background-color: #0f766e;
        }

        .error-message { 
            color: #dc2626; 
            background-color: #fee2e2; 
            padding: 12px; 
            border-radius: 10px; 
            margin-top: 15px; 
            border: 1px solid #ef4444; 
            text-align: center; 
            font-weight: 600;
            font-size: 0.9rem;
        }

        .life-counter { 
            text-align: center; 
            font-size: 1.8rem; 
            color: #ef4444; 
            margin-bottom: 0.75rem; 
            letter-spacing: 2px;
        }

        .results-panel {
            margin-top: 1.25rem;
            padding: 1.25rem;
            border-radius: 12px;
            text-align: left;
        }

        .results-panel.success {
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            color: #14532d;
        }

        .results-panel.failed {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #7f1d1d;
        }

        .results-title {
            font-size: 1.35rem;
            font-weight: 800;
            border-bottom: 1px solid currentColor;
            padding-bottom: 0.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .feedback-box {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .feedback-box.correct {
            background-color: #d1fae5;
            color: #065f46;
        }

        .feedback-box.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .hidden { 
            display: none !important; 
        }

        /* Estilos Adaptativos Responsive Mobile */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 15px;
                border-radius: 12px;
            }
            .main-title {
                font-size: 1.3rem;
            }
            .option-label {
                font-size: 0.9rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;" oncopy="return false;">

    <div class="container">
        <h1 class="main-title">Juego: Permutaciones</h1>
        
        <div id="player-selection-area" class="player-area">
            <div class="input-group">
                <label for="student-name-input" class="input-label">Nombre Completo del Estudiante:</label>
                <input type="text" id="student-name-input" placeholder="Ej: Juan Pérez" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="difficulty-select" class="input-label">Nivel de Dificultad:</label>
                <select id="difficulty-select">
                    <option value="Básico">Básico</option>
                    <option value="Intermedio" selected>Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
            </div>

            <button id="start-game-btn" class="submit-button">Empezar la Prueba</button>
            <div id="selection-error" class="error-message hidden">Por favor, escribe tu nombre para empezar la prueba.</div>
        </div>

        <div id="quiz-container">
            <div id="life-counter" class="life-counter hidden"></div>
            <div id="questions-list"></div>
            
            <button id="submit-answer-btn" class="submit-button hidden">Comprobar Respuesta</button>

            <div id="results" class="results-panel hidden"></div>
            <div id="answer-error" class="error-message hidden">Por favor, selecciona una respuesta.</div>
        </div>
    </div>
    
    <script>
        // SINTETIZADOR DE SONIDOS SINTETIZADOS CON WEB AUDIO API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.12);
                osc.frequency.setValueAtTime(659.25, now + 0.24);
                osc.frequency.setValueAtTime(880, now + 0.36);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            } else if (type === 'gameOver') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.6);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // ALGORITMO FISHER-YATES PARA DESORDENAR Y SELECCIONAR ALEATORIAMENTE
        function mezclarArreglo(arreglo) {
            let copia = [...arreglo];
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }
            return copia;
        }

        // SELECCIÓN Y FORMATEO DE 10 PREGUNTAS ALEATORIAS
        function obtenerPreguntasJuego(nivel) {
            let bancoSeleccionado = [];

            if (nivel === "Básico" && typeof bancoBajo !== 'undefined') {
                bancoSeleccionado = bancoBajo;
            } else if (nivel === "Avanzado" && typeof bancoAlto !== 'undefined') {
                bancoSeleccionado = bancoAlto;
            } else if (typeof bancoIntermedio !== 'undefined') {
                bancoSeleccionado = bancoIntermedio;
            }

            // Selecciona exactamente 10 preguntas al azar sin repetición
            const seleccionadas = mezclarArreglo(bancoSeleccionado).slice(0, 10);

            // Formatea desordenando también las opciones de respuesta
            return seleccionadas.map(q => {
                const opcionesMezcladas = mezclarArreglo([q.correcta, ...q.distractoras]);
                return {
                    question: q.pregunta,
                    options: opcionesMezcladas,
                    correctAnswer: q.correcta
                };
            });
        }

        function initializeGame() {
            const studentNameInput = document.getElementById('student-name-input');
            const difficultySelect = document.getElementById('difficulty-select');
            const startGameBtn = document.getElementById('start-game-btn');
            const submitAnswerBtn = document.getElementById('submit-answer-btn');
            const questionsList = document.getElementById('questions-list');
            const resultsDiv = document.getElementById('results');
            const selectionErrorDiv = document.getElementById('selection-error');
            const answerErrorDiv = document.getElementById('answer-error');
            const lifeCounterDiv = document.getElementById('life-counter');
            const playerSelectionArea = document.getElementById('player-selection-area');

            let currentQuizQuestions = [], lives = 3, questionIndex = 0, score = 0, gameStartTime, selectedDifficulty = 'Intermedio';

            function startGame() {
                initAudio();
                const playerName = studentNameInput.value.trim();
                if (playerName === '') {
                    selectionErrorDiv.classList.remove('hidden');
                    return;
                }
                selectionErrorDiv.classList.add('hidden');
                
                selectedDifficulty = difficultySelect.value;
                playerSelectionArea.style.display = 'none';
                resultsDiv.classList.add('hidden');

                lives = 3;
                questionIndex = 0;
                score = 0;
                updateLifeCounter();
                
                currentQuizQuestions = obtenerPreguntasJuego(selectedDifficulty);
                
                lifeCounterDiv.classList.remove('hidden');
                gameStartTime = new Date();
                renderQuestion();
            }

            function renderQuestion() {
                submitAnswerBtn.classList.remove('hidden');
                submitAnswerBtn.disabled = false;
                answerErrorDiv.classList.add('hidden');
                
                const q = currentQuizQuestions[questionIndex];

                questionsList.innerHTML = `
                    <div class="question-card">
                        <p class="question-text">${q.question}</p>
                        <div class="options-container">${q.options.map((option, i) => `
                            <input type="radio" name="q-option" value="${option.replace(/"/g, '&quot;')}" id="q-option-${i}">
                            <label for="q-option-${i}" class="option-label">${option}</label>`).join('')}
                        </div>
                    </div>`;
                
                if (window.MathJax) {
                    MathJax.typesetPromise([questionsList]).catch((err) => console.log('MathJax Error:', err));
                }
            }

            function checkAnswer() {
                const selectedOption = document.querySelector('input[name="q-option"]:checked');
                if (!selectedOption) {
                    answerErrorDiv.classList.remove('hidden');
                    return;
                }
                answerErrorDiv.classList.add('hidden');
                submitAnswerBtn.disabled = true;

                const q = currentQuizQuestions[questionIndex];
                document.querySelectorAll('input[name="q-option"]').forEach(input => {
                    input.disabled = true;
                    const label = document.querySelector(`label[for="${input.id}"]`);
                    if (input.value === q.correctAnswer) {
                        label.style.backgroundColor = '#d1fae5';
                        label.style.borderColor = '#10b981';
                        label.style.color = '#065f46';
                    }
                    if (input.checked && input.value !== q.correctAnswer) {
                        label.style.backgroundColor = '#fee2e2';
                        label.style.borderColor = '#ef4444';
                        label.style.color = '#991b1b';
                    }
                });
                
                const isCorrect = selectedOption.value === q.correctAnswer;
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = `feedback-box ${isCorrect ? 'correct' : 'incorrect'}`;
                
                if (isCorrect) {
                    score++;
                    playSound('correct');
                    feedbackDiv.textContent = '¡Correcto! ✅';
                } else {
                    lives--;
                    playSound('incorrect');
                    updateLifeCounter();
                    feedbackDiv.textContent = `Incorrecto. ❌ Te quedan ${lives} vidas.`;
                }
                document.querySelector('.question-card').appendChild(feedbackDiv);
                
                setTimeout(() => {
                    if (lives <= 0) return endGame(false);
                    questionIndex++;
                    if (questionIndex < currentQuizQuestions.length) renderQuestion();
                    else endGame(true);
                }, 2200);
            }

            function endGame(completed) {
                const gameEndTime = new Date();
                questionsList.innerHTML = '';
                submitAnswerBtn.classList.add('hidden');
                lifeCounterDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                
                const studentName = studentNameInput.value.trim();
                const notaFinal = ((score / 10) * 5).toFixed(1);

                const totalSeconds = Math.round((gameEndTime - gameStartTime) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const tiempoFormateado = `${minutes} min ${seconds} seg`;

                const fechaActual = gameEndTime.toLocaleString('es-CO', { 
                    dateStyle: 'long', 
                    timeStyle: 'medium' 
                });

                if (completed && score >= 6) {
                    playSound('victory');
                } else {
                    playSound('gameOver');
                }
                
                resultsDiv.className = `results-panel ${completed ? 'success' : 'failed'}`;
                resultsDiv.innerHTML = `
                    <h2 class="results-title">Resumen de Resultados</h2>
                    <p style="font-size: 1rem; margin: 0.5rem 0;"><strong>Estudiante:</strong> ${studentName}</p>
                    <p style="font-size: 1rem; margin: 0.5rem 0;"><strong>Nivel de Dificultad:</strong> ${selectedDifficulty}</p>
                    <p style="font-size: 1rem; margin: 0.5rem 0;"><strong>Nota Final:</strong> <span style="font-size: 1.4rem; font-weight: 800;">${notaFinal} / 5.0</span> (${score} aciertos de 10)</p>
                    <p style="margin: 0.5rem 0; font-size: 0.95rem;"><strong>Tiempo Empleado:</strong> ${tiempoFormateado}</p>
                    <p style="margin: 0.5rem 0; font-size: 0.95rem;"><strong>Fecha y Hora:</strong> ${fechaActual}</p>
                    <div style="margin-top: 1.25rem; text-align: center;">
                        <button onclick="verDiploma('${encodeURIComponent(studentName)}', '${notaFinal}', '${encodeURIComponent(fechaActual)}', '${encodeURIComponent(selectedDifficulty)}')" class="btn-diploma">
                            🖨️ Ver / Imprimir Diploma
                        </button>
                    </div>
                `;

                playerSelectionArea.style.display = 'block';
                startGameBtn.textContent = 'Volver a Presentar Prueba';

                if (window.MathJax) MathJax.typeset();
            }

            function updateLifeCounter() {
                lifeCounterDiv.innerHTML = 'Vidas: ' + '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
            }

            window.verDiploma = function(nombre, nota, fecha, nivel) {
                const url = `diploma.html?nombre=${nombre}&juego=${encodeURIComponent("Auditoría de Matemáticas")}&puntaje=${nota}&fecha=${fecha}&nivel=${nivel}`;
                window.open(url, '_blank');
            };

            startGameBtn.addEventListener('click', startGame);
            submitAnswerBtn.addEventListener('click', checkAnswer);
        }

        // Event listener por si MathJax carga antes
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof MathJax === 'undefined' || !MathJax.startup) {
                initializeGame();
            }
        });
    </script>
</body>
</html>
